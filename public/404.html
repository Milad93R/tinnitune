<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Tinnitune</title>
    <meta name="theme-color" content="#f4eddd" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; padding: 24px; min-height: 100dvh; display: grid; place-items: center; background: #f4eddd; color: #232c22; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 540px); background: #fbf5e8; border: 1px solid #a8997d; box-shadow: 4px 5px #b7a58266; padding: clamp(18px, 6vw, 44px); }
      .code { color: #863926; font: 600 12px ui-monospace, monospace; letter-spacing: .12em; padding-bottom: 12px; border-bottom: 3px double #a8997d; }
      h1 { font: 400 clamp(2.2rem, 8vw, 3.2rem)/1 Georgia, serif; margin: 14px 0; }
      p { color: #484b3d; margin: 0 0 20px; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px; background: #263d30; color: #fbf5e8; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404 · SILENT BAND</div>
      <h1>Frequency not found</h1>
      <p>This path isn't part of Tinnitune. Return to the main acoustic workspace to match your pitch or start notched relief.</p>
      <a href="/">Return to Tinnitune</a>
    </main>
  </body>
</html>
